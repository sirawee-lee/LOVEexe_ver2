<script type="text/javascript">
(function () {
    // open web debugger console
    if (typeof VConsole !== 'undefined') {
        window.vConsole = new VConsole();
    }

    var debug = window._CCSettings.debug;
    var splash = document.getElementById('splash');
    splash.style.display = 'block';

    function loadScript (moduleName, cb) {
      function scriptLoaded () {
          document.body.removeChild(domScript);
          domScript.removeEventListener('load', scriptLoaded, false);
          cb && cb();
      };
      var domScript = document.createElement('script');
      domScript.async = true;
      domScript.src = moduleName;
      domScript.addEventListener('load', scriptLoaded, false);
      document.body.appendChild(domScript);
    }

    loadScript(debug ? 'cocos2d-js.js' : 'cocos2d-js-min.js', function () {
      if (CC_PHYSICS_BUILTIN || CC_PHYSICS_CANNON) {
        loadScript(debug ? 'physics.js' : 'physics-min.js', window.boot);
      }
      else {
        window.boot();
      }
    });
})();
</script>

<!-- 🌹 Rose-petal overlay — pure CSS/JS, pointer-events:none, auto-gated to the title scene -->
<style id="rose-petal-style">
  #rose-petals{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:99999;opacity:0;transition:opacity .9s ease}
  #rose-petals.on{opacity:1}
  #rose-petals .petal{position:absolute;top:-10vh;will-change:transform;
    animation:petal-fall linear infinite, petal-sway ease-in-out infinite alternate}
  #rose-petals .petal>i{display:block;width:100%;height:100%;
    border-radius:100% 0 100% 0;
    background:
      radial-gradient(circle at 30% 25%, rgba(255,255,255,.6), rgba(255,255,255,0) 50%),
      linear-gradient(135deg, var(--c1), var(--c2));
    box-shadow:inset -1px -1px 2px rgba(170,30,70,.28);
    will-change:transform;
    animation:petal-flutter ease-in-out infinite alternate}
  @keyframes petal-fall{from{transform:translateY(-12vh)}to{transform:translateY(114vh)}}
  @keyframes petal-sway{from{margin-left:-34px}to{margin-left:34px}}
  @keyframes petal-flutter{from{transform:rotateZ(var(--r0)) rotateY(0) scaleX(1)}
    to{transform:rotateZ(var(--r1)) rotateY(180deg) scaleX(.55)}}
  @media (prefers-reduced-motion: reduce){#rose-petals{display:none}}
</style>
<script id="rose-petal-script">
(function(){
  var COUNT = 26;
  var COLORS = [['#ffd1dc','#ff8fab'],['#ffb7c5','#ff6b8a'],['#ff9ebb','#e75480'],
                ['#ffc2d1','#ff7aa2'],['#fbb6ce','#f06595']];
  function rnd(a,b){return a+Math.random()*(b-a)}
  function pick(a){return a[(Math.random()*a.length)|0]}
  var layer=document.createElement('div'); layer.id='rose-petals';
  function build(){
    for(var i=0;i<COUNT;i++){
      var p=document.createElement('div'); p.className='petal';
      var size=rnd(10,22), col=pick(COLORS), fall=rnd(7,14), sway=rnd(3,6), flut=rnd(2.2,4.6);
      p.style.left=rnd(-5,100)+'vw';
      p.style.width=size+'px'; p.style.height=(size*1.15)+'px';
      p.style.opacity=rnd(.5,.95);
      p.style.animationDuration=fall+'s,'+sway+'s';
      p.style.animationDelay=(-rnd(0,fall))+'s,'+(-rnd(0,sway))+'s';
      var inner=document.createElement('i');
      inner.style.setProperty('--c1',col[0]); inner.style.setProperty('--c2',col[1]);
      inner.style.setProperty('--r0',rnd(-40,40)+'deg'); inner.style.setProperty('--r1',rnd(150,330)+'deg');
      inner.style.animationDuration=flut+'s'; inner.style.animationDelay=(-rnd(0,flut))+'s';
      p.appendChild(inner); layer.appendChild(p);
    }
  }
  function start(){
    if(!document.body){return setTimeout(start,50)}
    document.body.appendChild(layer); build();
    requestAnimationFrame(function(){layer.classList.add('on')});
    var titleName=null;
    setInterval(function(){
      var name=null;
      try{ if(window.cc&&cc.director&&cc.director.getScene){var s=cc.director.getScene(); if(s)name=s.name;} }catch(e){}
      if(name&&titleName===null)titleName=name;            // first loaded scene == title screen
      var onTitle=(name===null)||(titleName!==null&&name===titleName);
      layer.classList.toggle('on',onTitle);
    },600);
  }
  start();
})();
</script>
</body>
